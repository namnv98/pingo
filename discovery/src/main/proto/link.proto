syntax = "proto3";

package com.lego.namnv.discovery.grpc;

option java_package = "com.lego.namnv.discovery.grpc";
option java_multiple_files = true;

// Envelope + service duy nhất cho chặng harbor<->colony (KHONG dung cho client<->harbor -- cai do
// van la SockJS/WebSocket + JSON SocketFrame, khong doi, xem ARCHITECTURE.md muc 3). Thay the toan
// bo BackendLinkGateway's N-shard-link + colony's ChatLink/ChatSubscriber split cu: gRPC/HTTP2 da
// tu multiplex nhieu stream tren 1 connection dung, nen 1 call = 1 (harbor session, colony pod) --
// khong con can field harborSessionId de demux nua, vi ban than stream la 1 danh tinh (identity)
// roi (xem ARCHITECTURE.md muc 12, viet lai).
enum FrameType {
  FRAME_TYPE_UNSPECIFIED = 0;
  SUBSCRIBE = 1;
  SUBSCRIBE_OK = 2;
  SUBSCRIBE_ERROR = 3;
  MESSAGE = 4;
  ACK = 5;
  ERROR = 6;
}

message Frame {
  string id = 1;
  FrameType type = 2;
  string from_user_id = 3;
  string conversation_id = 4;
  repeated string member_user_ids = 5;
  // Payload tuy y (opaque), JSON-encoded string -- server khong doc/hieu noi dung ben trong, cung
  // hop dong voi SocketFrame.body ben client<->harbor, chi khac cho tuong minh ve encoding vi
  // proto3 khong co kieu "JSON tu do" nhu JsonObject cua Vert.x.
  string body_json = 6;
  string reason = 7;
  int64 ts = 8;
}

service Link {
  // 1 call = ca vong doi cua 1 (harbor session, colony pod) -- moi SUBSCRIBE/MESSAGE cua session do
  // toi dung pod do di tren cung 1 stream nay, theo thu tu. Stream ket thuc (client end() hoac
  // server end()) thay the hoan toan cho SESSION_CLOSED frame cu.
  rpc Stream(stream Frame) returns (stream Frame);
}
