# Cluster Hazelcast CHUNG voi beacon/colony/harbor -- can de vertx.eventBus().publish() (xem
# HallApiHandlers#createConversation) toi duoc RoutingVersionSync ben harbor, khong con la eventbus
# local rieng cua hall nua (truoc day hall KHONG cluster vi chi la REST API thuan, khong can gossip
# gi -- gio can publish 1 su kien nen phai join chung cluster, xem HallBoot).
hazelcast:
  file: hall/src/main/resources/hazelcast-local.xml
  props: { }
publicHttp:
  tags: public
  port: 8085
  path:
  headers:
    content-type: application/json
  printStackTrace: false
# PHAI khop voi authTokenSecret cua harbor (app-local.yaml) va colony -- dung de ky/verify JWT xac thuc client.
authTokenSecret: pingo-local-dev-auth-secret

database:
  # Postgres cua chinh cum k3s local (xem postgres/helm), truy cap tu ngoai qua NodePort 31005 --
  # dung khi chay local bang "mvn exec:java" (khong o trong k8s nen khong resolve duoc DNS "postgres").
  parsedUri:
    databaseType: postgres
    scheme: steady
    addresses:
      - localhost:31005
    path: pingo
    user: pingo
    password: pingo-local-dev
    params:
      maxSize: 8
      maxWaitQueueSize: 1024
