apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config-files
data:
  app.yaml: |
    # Cluster Hazelcast CHUNG voi beacon/colony/harbor -- can de vertx.eventBus().publish() (xem
    # HallApiHandlers#createConversation) toi duoc RoutingVersionSync ben harbor.
    hazelcast:
      file: /hazelcast-files/hazelcast.xml
      props: { }
    publicHttp:
      tags: public
      port: 8085
      path:
      headers:
        content-type: application/json
      printStackTrace: false
    # PHAI khop voi authTokenSecret cua harbor va colony -- dung de ky/verify JWT xac thuc client.
    authTokenSecret: pingo-local-dev-auth-secret
    database:
      parsedUri:
        databaseType: postgres
        scheme: steady
        addresses:
          - postgres:5432
        path: pingo
        user: pingo
        password: pingo-local-dev
        params:
          maxSize: 8
          maxWaitQueueSize: 1024
  log4j2.xml: |
{{ .Files.Get "config/log4j2.xml" | indent 4 }}
