apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/monitor: "true"
spec:
  selector:
    app: {{ .Chart.Name }}
  type: NodePort
  ports:
    - name: http
      port: 8085
      targetPort: 8085
      # Giu nguyen NodePort 31002 -- da la REST API base ma e2e/lib.mjs va demo.html dang tro toi
      # tu truoc khi tach khoi colony, khong doi gi ca ben ngoai.
      nodePort: 31002
