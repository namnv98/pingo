apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config-files
data:
  app.yaml: |
    basePackage: com.lego.namnv
    hazelcast:
      file: /hazelcast-files/hazelcast.xml
      props: { }
    admEventBus:
      address: ${HOSTNAME}
      tags: private
      printStackTrace: false
    publicHttp:
      tags: public
      port: 8080
      path:
      headers:
        content-type: application/json
      printStackTrace: false
    admHttp:
      tags: private
      port: 8087
    chatSocket:
      host: 0.0.0.0
      port: 8888
      path: /connect
      serviceName: eb_gossip_adm
    chatBackend:
      port: 9999
      path: /connect
  log4j2.xml: |
{{ .Files.Get "config/log4j2.xml" | indent 4 }}