apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config-files
data:
  app.yaml: |
    basePackage: com.lego.namnv
    hazelcast:
      file: /hazelcast-files/hazelcast.xml
      props: { }
    admEventBus:
      address: ${HOSTNAME}
      tags: private
      printStackTrace: false
    publicHttp:
      tags: public
      port: 8080
      path:
      headers:
        content-type: application/json
      printStackTrace: false
    admHttp:
      tags: private
      port: 8087
    chatSocket:
      host: 0.0.0.0
      port: 8888
      path: /connect
      serviceName: eb_gossip_adm
    chatBackend:
      port: 9999
      path: /connect
    # PHAI khop voi authTokenSecret cua colony -- dung de ky/verify JWT xac thuc client.
    authTokenSecret: pingo-local-dev-auth-secret
    database:
      # Harbor tu doc ConversationMembershipRegistry (chat-domain) de auto-subscribe user vao het
      # conversation cua ho ngay sau AUTH -- chi doc, pool nho la du (xem app-local.yaml).
      parsedUri:
        databaseType: postgres
        scheme: steady
        addresses:
          - postgres:5432
        path: pingo
        user: pingo
        password: pingo-local-dev
        params:
          maxSize: 8
          maxWaitQueueSize: 256
  log4j2.xml: |
{{ .Files.Get "config/log4j2.xml" | indent 4 }}