basePackage: com.lego.namnv
hazelcast:
  file: /harbor/src/main/resources/hazelcast-local.xml
  props: { }
admEventBus:
  address: harbor
  tags: private
  printStackTrace: false
msgEventBus:
  address: harbor
  tags: private
  printStackTrace: false
admHttp:
  tags: private
  port: 8087
  path:
  headers:
    content-type: application/json
publicHttp:
  tags: public
  port: 8086
  path:
  headers:
    content-type: application/json
  printStackTrace: false
invalidateCacheConfig:
  eventBusAddress: lego-invalid-cache-info
chatSocket:
  host: 0.0.0.0
  port: 8888
  path: /connect
  serviceName: eb_gossip_adm # định danh fallback dùng cho local dev; khi chạy production, HOSTNAME (tên pod k8s) sẽ được ưu tiên dùng thay
chatBackend:
  port: 9999
  path: /connect # phải khớp với chatSocket.path bên colony
# PHAI khop voi authTokenSecret cua colony (app.yaml) -- dung de ky/verify JWT xac thuc client.
authTokenSecret: pingo-local-dev-auth-secret
database:
  # Harbor tu doc thang ConversationMembershipRegistry (chat-domain) de auto-subscribe user vao het
  # cac conversation cua ho ngay sau AUTH, khong doi client tu goi SUBSCRIBE tung conversationId mot
  # (xem HarborSessionManager#handleAuth) -- chi doc (khong ghi), pool nho la du.
  parsedUri:
    databaseType: postgres
    scheme: steady
    addresses:
      - localhost:31005
    path: pingo
    user: pingo
    password: pingo-local-dev
    params:
      maxSize: 8
      maxWaitQueueSize: 256