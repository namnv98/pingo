apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
data:
  # Image postgres chinh thuc tu dong chay moi file *.sql trong /docker-entrypoint-initdb.d/ DUY
  # NHAT 1 LAN luc container khoi dong voi data directory rong (lan dau tien, hoac sau khi xoa PVC)
  # -- khong chay lai o nhung lan start sau, nen dung IF NOT EXISTS la du, khong can body idempotent
  # phuc tap hon.
  schema.sql: |
    CREATE TABLE IF NOT EXISTS conversation_members (
        conversation_id UUID NOT NULL,
        user_id UUID NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (conversation_id, user_id)
    );
    -- Danh cho truy van sau nay "user X thuoc nhung conversation nao" (sync luc client connect,
    -- xem REAL_TIME_MESSAGING.md) -- chua co code nao dung toi trong dot nay, nhung them index
    -- ngay tu dau gan nhu khong ton chi phi gi, tranh phai them sau tren bang da co du lieu.
    CREATE INDEX IF NOT EXISTS idx_conversation_members_user ON conversation_members (user_id);
    -- Tat/bat thong bao rieng cua TUNG thanh vien cho 1 conversation (khac name/avatar o duoi -- 2
    -- cot do dung chung cho MOI thanh vien, con muted la state rieng tu cua chinh dong nay). Doc lai
    -- o ChatSessionManager#createNotification/#publishNotificationCandidates de chan notification/push.
    ALTER TABLE conversation_members ADD COLUMN IF NOT EXISTS muted BOOLEAN NOT NULL DEFAULT false;
    -- Role trong group: 'owner' (nhieu owner cung luc duoc, xem ConversationMembershipRegistry#setRole)
    -- hoac 'member'. Nguoi tao conversation luon la owner dau tien (HallApiHandlers#createConversation);
    -- moi thanh vien them sau qua addMembers giu DEFAULT 'member'. Quy tac "luon con it nhat 1 owner
    -- neu nhom con thanh vien khac" duoc gac o tang HallApiHandlers (removeConversationMember/
    -- setConversationMemberRole), KHONG phai constraint DB -- xoa/ha owner cuoi cung bat buoc phai
    -- chi dinh 1 owner moi truoc, xem javadoc 2 method do.
    ALTER TABLE conversation_members ADD COLUMN IF NOT EXISTS role TEXT NOT NULL DEFAULT 'member';

    -- Ten rieng (tuy chon) cho 1 conversation, dung chung cho MOI thanh vien (khac ban dau chi luu
    -- localStorage rieng tung trinh duyet) -- xem ConversationMembershipRegistry#upsertName,
    -- HallApiHandlers POST/PUT /conversations. Loose-schema quen thuoc cua repo: KHONG bat buoc co
    -- dong cho moi conversationId -- chi ton tai khi da tung duoc dat ten HOAC dat anh dai dien rieng;
    -- client tu suy label tu danh sach thanh vien khi khong co dong nao khop (xem conversationLabel).
    CREATE TABLE IF NOT EXISTS conversations (
        id UUID NOT NULL PRIMARY KEY,
        name TEXT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    -- Anh dai dien rieng cho 1 GROUP (khong danh cho DM -- DM hien avatar that cua nguoi kia, xem
    -- conversationAvatar() phia client) -- cung tro toi files.id nhu users.avatar_file_id o tren.
    -- Tach rieng upsertAvatar() voi upsertName() (ConversationMembershipRegistry): xoa ten rieng
    -- (name = NULL) KHONG duoc lam mat anh dai dien da dat rieng tren cung 1 dong nay.
    ALTER TABLE conversations ADD COLUMN IF NOT EXISTS avatar_file_id UUID;

    -- He thong login THAT: username + password (hash bang bcrypt, xem UserRegistry/RestApiVerticle
    -- POST /register, /login) -- khong con la "dang ky ten hien thi" don thuan nhu truoc nua.
    -- username la UNIQUE vi login tra cuu theo username. id do server tu sinh luc /register (khong
    -- con do client tu khai/tu chon nhu truoc).
    CREATE TABLE IF NOT EXISTS users (
        id UUID NOT NULL PRIMARY KEY,
        username TEXT NOT NULL UNIQUE,
        password_hash TEXT NOT NULL,
        first_seen_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    -- Anh dai dien ca nhan -- tro toi files.id (khong FK, dung quy uoc loose-schema cua ca file nay),
    -- file that upload/luu qua cung duong file-server nhu anh/video gui trong chat (xem FileRegistry).
    -- NULL = chua dat, client tu ve vong tron mau + chu cai dau (xem avatarColor/avatarInitial).
    ALTER TABLE users ADD COLUMN IF NOT EXISTS avatar_file_id UUID;

    -- 4 tai khoan test co san -- mat khau THAT ca 4 deu la "123456aA@" (hash bcrypt ben duoi, tao
    -- bang chinh org.mindrot.jbcrypt ma UserRegistry dung, KHONG phai gia lap) -- khoi phai
    -- POST /register lai tu dau moi lan xoa PVC/deploy lai cum local. ON CONFLICT DO NOTHING: file
    -- nay van co the chay lai tren 1 DB da co san (xem cac khoi ALTER TABLE IF NOT EXISTS khac trong
    -- file nay), khong duoc lam vo UNIQUE(username) hay ghi de mat khau nguoi dung da tung doi.
    INSERT INTO users (id, username, password_hash) VALUES
        ('7b9ed680-5084-472d-8877-4708bdfdb9fa', 'namnv98', '$2a$10$Jad6FtCkbhmDQI6KDBo/dOS0wM/EDQ.8IH95MG1T2XwzeHQEcguQm'),
        ('42c4e5c3-dfa5-4cda-be97-17b492c1adbf', 'namnv99', '$2a$10$Jad6FtCkbhmDQI6KDBo/dOS0wM/EDQ.8IH95MG1T2XwzeHQEcguQm'),
        ('c4f9b475-08cc-4453-a85f-eb2d3cf9056a', 'namnv97', '$2a$10$Jad6FtCkbhmDQI6KDBo/dOS0wM/EDQ.8IH95MG1T2XwzeHQEcguQm'),
        ('78926d64-7774-46b1-a763-e41c9d9e940a', 'namnv96', '$2a$10$Jad6FtCkbhmDQI6KDBo/dOS0wM/EDQ.8IH95MG1T2XwzeHQEcguQm')
    ON CONFLICT (username) DO NOTHING;

    -- Lich su tin nhan -- xem MessageHistoryRegistry (colony). Khong co FK toi conversation_members
    -- hay users, giu dung quy uoc loose-schema da co san cua conversation_members (khong co bang
    -- conversations rieng de FK toi).
    CREATE TABLE IF NOT EXISTS messages (
        id UUID NOT NULL PRIMARY KEY,
        conversation_id UUID NOT NULL,
        from_user_id UUID NOT NULL,
        -- Luu duoi dang JSON string (Json.encode(body)), KHONG dung JSONB -- tranh phai phu thuoc
        -- dung cach vertx-pg-client wrap/unwrap kieu JSON polymorphic (body la Object bat ky tu
        -- SocketFrame, server khong doc/hieu noi dung ben trong) -- chi can luu/tra lai nguyen
        -- ven cho list API, khong can query theo noi dung body.
        body TEXT,
        created_at TIMESTAMPTZ NOT NULL,
        -- Xoa MEM: NULL = chua xoa, co gia tri = da xoa luc do (xem MessageHistoryRegistry#markDeleted).
        -- Dong VAN CON trong bang (khong DELETE that) -- API doc (listMessages) tu an body/reactions
        -- khi cot nay khac NULL, khong phai xoa du lieu that.
        deleted_at TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS idx_messages_conversation_created ON messages (conversation_id, created_at DESC);

    -- Ai (user_id) da THUC SU xem 1 message_id -- nguon that cho dau "da xem" (khac SEEN qua WS,
    -- von chi la tin hieu tam thoi khong luu, mat khi reload trang). PRIMARY KEY (message_id,
    -- user_id): 1 nguoi chi can 1 dong "da xem" cho 1 tin, ON CONFLICT DO NOTHING khi ghi lai.
    -- Khong FK toi messages, giu dung quy uoc loose-schema cua repo.
    CREATE TABLE IF NOT EXISTS message_reads (
        message_id UUID NOT NULL,
        user_id UUID NOT NULL,
        read_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (message_id, user_id)
    );
    CREATE INDEX IF NOT EXISTS idx_message_reads_message ON message_reads (message_id);

    -- Reaction (emoji) tren 1 message_id, kieu Facebook: 1 NGUOI chi co 1 reaction cho 1 tin tai 1
    -- thoi diem (chon emoji khac se THAY THE, khong cong don) -- PRIMARY KEY (message_id, user_id)
    -- ep dung dieu do. emoji luu nguyen ky tu (vd "\xf0\x9f\x91\x8d") thay vi ten rieng, don gian
    -- hoa ca ghi lan doc, client tu hien thi.
    CREATE TABLE IF NOT EXISTS message_reactions (
        message_id UUID NOT NULL,
        user_id UUID NOT NULL,
        emoji TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (message_id, user_id)
    );
    CREATE INDEX IF NOT EXISTS idx_message_reactions_message ON message_reactions (message_id);

    -- Ghim CHUNG (moi thanh vien conversation deu thay) -- 1 message_id chi ghim duoc 1 lan (PRIMARY
    -- KEY message_id), ai ghim truoc thi pinned_by la nguoi do, ghim lai (da ton tai) la no-op (xem
    -- MessagePinRegistry#pinShared). Tach bang rieng voi message_pins_private (thay vi 1 bang + cot
    -- scope/user_id nullable) de tranh NULL khong unique trong PRIMARY KEY cua Postgres, giu dung
    -- quy uoc loose-schema/khong FK cua repo.
    CREATE TABLE IF NOT EXISTS message_pins_shared (
        message_id UUID NOT NULL PRIMARY KEY,
        conversation_id UUID NOT NULL,
        pinned_by UUID NOT NULL,
        pinned_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_message_pins_shared_conversation ON message_pins_shared (conversation_id, pinned_at DESC);

    -- Ghim RIENG -- chi userId da ghim thay duoc, khong fan-out qua WS (xem ChatSessionManager#handlePin),
    -- chi mong tin qua GET /pins. PRIMARY KEY (message_id, user_id): 1 nguoi ghim 1 tin toi da 1 dong.
    CREATE TABLE IF NOT EXISTS message_pins_private (
        message_id UUID NOT NULL,
        user_id UUID NOT NULL,
        conversation_id UUID NOT NULL,
        pinned_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (message_id, user_id)
    );
    CREATE INDEX IF NOT EXISTS idx_message_pins_private_user ON message_pins_private (conversation_id, user_id, pinned_at DESC);

    -- Link trich tu noi dung tin nhan (body.message), 1 dong/URL tim thay -- ghi ngay luc luu tin
    -- (xem ChatSessionManager#persistMessage -> MessageLinkRegistry#extractAndSave), tranh phai quet
    -- lai messages.body (TEXT chua JSON) moi lan mo tab Links. Khong xoa khi tin bi xoa mem -- GET
    -- /links tu loc bang JOIN messages WHERE deleted_at IS NULL (xem MessageLinkRegistry#listForConversation).
    CREATE TABLE IF NOT EXISTS message_links (
        id UUID NOT NULL PRIMARY KEY,
        message_id UUID NOT NULL,
        conversation_id UUID NOT NULL,
        from_user_id UUID NOT NULL,
        url TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_message_links_conversation_created ON message_links (conversation_id, created_at DESC);

    -- "type" phan biet nguon goc 1 dong noti (xem NotificationRegistry):
    --   'message' -- ban co tin nhan moi luc OFFLINE HOAN TOAN (khong session WS nao song o bat ky
    --               pod harbor nao -- xem PresenceRegistry, chat-domain) -- ghi qua herald
    --               NotificationConsumer, CO dieu kien (chi luu neu that su offline/khong ACK kip).
    --   'mention'/'reply'/'reaction' -- ai do @nhac ten/tra loi/tha cam xuc vao tin CUA MINH -- ghi
    --               THANG tu colony ChatSessionManager luc persist tin/reaction, LUON luu (khong
    --               dieu kien online/offline, giong feed hoat dong cua Teams/Slack: van hien trong
    --               chuong dai du ban da thay tin do truc tiep trong khung chat).
    -- message_id: tin nhan lien quan (tin duoc nhac/duoc tra loi/duoc tha cam xuc) -- dung de "nhay
    -- toi dung tin" tu client (xem jumpToMessage trong history-ws.js). NULL cho du lieu cu truoc khi
    -- co cot nay (khong the truy hoi lai duoc, chap nhan duoc vi chi anh huong noti rat cu).
    -- created_at: luc SU KIEN xay ra (tin toi/react/tra loi/nhac ten) -- quyet dinh thu tu "moi nhat
    -- truoc". message_ts: gio tin GOC that su duoc gui -- voi "reaction" co the LECH XA created_at
    -- (react vao 1 tin rat cu); voi "mention"/"reply"/"message" thi luon bang nhau. Client dung
    -- rieng message_ts lam moc "seek" khi tin chua co san trong khung chat -- LAN 2 gia tri nay la
    -- bug that da gap: dung nham created_at (luc react) lam moc seek se tim sai han quanh "bay gio"
    -- thay vi quanh luc tin goc that su duoc gui, luon bao "khong tim thay tin goc" du tin con nguyen
    -- (xem javadoc ChatSessionManager#createNotification).
    CREATE TABLE IF NOT EXISTS notifications (
        id UUID NOT NULL PRIMARY KEY,
        user_id UUID NOT NULL,
        conversation_id UUID NOT NULL,
        from_user_id UUID NOT NULL,
        message_id UUID,
        type TEXT NOT NULL DEFAULT 'message',
        body_preview TEXT,
        created_at TIMESTAMPTZ NOT NULL,
        message_ts TIMESTAMPTZ,
        read_at TIMESTAMPTZ
    );
    -- ALTER ... IF NOT EXISTS -- cum da deploy tu truoc (PVC con giu qua --uninstall, xem
    -- deploy-k3s.sh) co bang notifications CHUA co cac cot nay -- CREATE TABLE IF NOT EXISTS o tren
    -- se khong tu them cot vao bang da ton tai, phai ALTER rieng de nang cap tai cho, khong mat du
    -- lieu cu.
    ALTER TABLE notifications ADD COLUMN IF NOT EXISTS message_id UUID;
    ALTER TABLE notifications ADD COLUMN IF NOT EXISTS type TEXT NOT NULL DEFAULT 'message';
    ALTER TABLE notifications ADD COLUMN IF NOT EXISTS message_ts TIMESTAMPTZ;
    CREATE INDEX IF NOT EXISTS idx_notifications_user_unread ON notifications (user_id, created_at DESC) WHERE read_at IS NULL;

    -- Token push (FCM) cua tung thiet bi/trinh duyet -- xem PushTokenRegistry, herald PushService.
    -- token la PRIMARY KEY (khong phai user_id) vi 1 token chi thuoc ve 1 thiet bi/cai dat tai 1
    -- thoi diem -- dang ky lai (vd doi user dang nhap tren cung may) se UPSERT de token luon tro ve
    -- dung user hien tai, khong con tro nham qua user cu.
    CREATE TABLE IF NOT EXISTS push_tokens (
        token TEXT NOT NULL PRIMARY KEY,
        user_id UUID NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_push_tokens_user_id ON push_tokens (user_id);

    -- Metadata cho anh/video gui trong chat (hall thay the service "jad" bi thieu ma module
    -- file-server (nginx/Lua) can goi ra -- xem FileRegistry). "path" luon co dinh 1 gia tri
    -- (STORAGE_PATH ben Java) -- file that nam o <uploadFolder cua file-server> + path + id.
    -- mime/size/name deu con NULL luc vua tao (POST /file/create), duoc dien vao sau khi file-server
    -- ghi xong bytes len dia (POST /file/update).
    CREATE TABLE IF NOT EXISTS files (
        id UUID NOT NULL PRIMARY KEY,
        user_id UUID,
        -- Gan thang file voi 1 conversationId (khong can bang trung gian rieng -- 1 file trong app
        -- nay luon thuoc dung 1 conversation, khong bao gio dung chung giua nhieu noi) -- cho phep
        -- liet ke lai truc tiep bang WHERE conversation_id = ?, khong can parse nguoc lai body cua
        -- tung tin nhan (xem FileRegistry#listForConversation, tab "Files" panel Info demo.html).
        conversation_id UUID,
        path TEXT NOT NULL,
        mime TEXT,
        size BIGINT,
        name TEXT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_files_conversation_created ON files (conversation_id, created_at DESC);

    -- "Con tro da doc" cua TUNG user trong TUNG conversation -- 1 dong per (conversation, user), luon
    -- CHI TIEN VE PHIA TRUOC (xem MessageHistoryRegistry#markRead, UPDATE ... WHERE EXCLUDED.last_read_ts
    -- > conversation_reads.last_read_ts). Khac message_reads (1 dong PER MESSAGE, dung de tinh cot
    -- "seen" tra ve tren MOI tin) -- bang nay chi giu DUY NHAT vi tri doc GAN NHAT, dung de client biet
    -- "vao lai conversation thi cuon toi dau" (xem demo.html loadHistory) ma khong can quet lai toan
    -- bo message_reads moi lan mo conversation.
    CREATE TABLE IF NOT EXISTS conversation_reads (
        conversation_id UUID NOT NULL,
        user_id UUID NOT NULL,
        last_read_message_id UUID NOT NULL,
        last_read_ts BIGINT NOT NULL,
        PRIMARY KEY (conversation_id, user_id)
    );

    -- Tim kiem noi dung tin nhan (full-text search) -- search_text la phan chu THUAN (body.message)
    -- trich rieng luc INSERT (xem MessageHistoryRegistry#saveMessage), KHONG dong bo lai khi
    -- enrichLinkPreview UPDATE body sau nay (enrich chi them body.preview, khong bao gio doi
    -- body.message). Tin nhan tu TRUOC migration nay co search_text = NULL (khong tim duoc) -- chap
    -- nhan duoc, giong cac cot ALTER them sau khac trong file nay, khong backfill.
    ALTER TABLE messages ADD COLUMN IF NOT EXISTS search_text TEXT;

    -- Tim KHONG can go dau tieng Viet (bug that da gap: config 'simple' mac dinh KHONG tu bo dau, go
    -- "chao" khong ra "chào") -- tao 1 text search configuration RIENG "pingo_search", copy tu
    -- 'simple' roi gan them dictionary "unaccent" (extension chuan cua Postgres) TRUOC dictionary
    -- simple trong chuoi mapping. Day la cach lam dung khuyen nghi cua Postgres (khac voi tu goi ham
    -- unaccent() truc tiep len van ban): to_tsvector/ts_headline/websearch_to_tsquery dung config nay
    -- se TU tach dau luc so khop lexeme, nhung van giu nguyen van ban GOC (co dau) de hien thi snippet
    -- -- khong bi mat dau nhu cach goi unaccent() thang vao van ban roi moi dua vao ts_headline.
    CREATE EXTENSION IF NOT EXISTS unaccent;
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_ts_config WHERE cfgname = 'pingo_search') THEN
            CREATE TEXT SEARCH CONFIGURATION pingo_search (COPY = simple);
            ALTER TEXT SEARCH CONFIGURATION pingo_search
                ALTER MAPPING FOR hword, hword_part, word WITH unaccent, simple;
        END IF;
    END $$;

    -- search_vector la generated column tu search_text (qua config pingo_search o tren), GIN index de
    -- query nhanh qua @@ websearch_to_tsquery (xem MessageHistoryRegistry#searchMessages). DROP truoc
    -- roi ADD lai (thay vi ADD COLUMN IF NOT EXISTS nhu moi noi khac trong file nay) vi day la cot
    -- GENERATED thuan tuy suy ra tu search_text (khong phai du lieu goc) -- an toan de tai tao lai moi
    -- lan chay script, dam bao ban da tung deploy TRUOC KHI co config pingo_search (dung 'simple' thang,
    -- khong bo dau duoc) cung duoc nang cap dung theo dinh nghia moi nay.
    ALTER TABLE messages DROP COLUMN IF EXISTS search_vector;
    ALTER TABLE messages ADD COLUMN search_vector tsvector
        GENERATED ALWAYS AS (to_tsvector('pingo_search', coalesce(search_text, ''))) STORED;
    CREATE INDEX IF NOT EXISTS idx_messages_search_vector ON messages USING GIN (search_vector);

    -- Sua tin nhan da gui -- KHONG gioi han thoi gian (khac Messenger/Zalo co gioi han vai chuc phut),
    -- KHONG gioi han so lan. edited_at = lan sua GAN NHAT (NULL = chua tung sua) -- client dung cot
    -- nay quyet dinh co hien nhan "(da chinh sua)" hay khong (xem MessageHistoryRegistry#editMessage).
    ALTER TABLE messages ADD COLUMN IF NOT EXISTS edited_at TIMESTAMPTZ;

    -- Lich su cac phien ban CU (truoc lan sua gan nhat) cua 1 tin -- moi lan sua, ban HIEN TAI (sap bi
    -- ghi de) duoc chup lai vao day TRUOC KHI UPDATE messages.body, nen bang nay luon la cac phien ban
    -- CU, phien ban MOI NHAT luon nam trong messages.body (khong luu trung o day). Xem UI hien thi lich
    -- su: noi 2 nguon lai theo edited_at (message_edits) roi den messages.updated (hien tai) la day du.
    -- Khong FK toi messages, giu dung quy uoc loose-schema cua repo (giong moi bang message_* khac).
    CREATE TABLE IF NOT EXISTS message_edits (
        id UUID NOT NULL PRIMARY KEY,
        message_id UUID NOT NULL,
        previous_body TEXT,
        edited_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- ================= Mã hoá đầu cuối (E2E, dùng thư viện Olm/Megolm phía client) =================
    -- users.e2e_identity_key (CỘT CŨ, còn giữ lại nhưng KHÔNG dùng nữa) -- bản đầu tiên gán 1 identity
    -- key DUY NHẤT cho cả TÀI KHOẢN (mọi thiết bị dùng chung), gây xung đột khi mở nhiều nơi + không
    -- có fan-out per-device thật. Từ giờ MỖI THIẾT BỊ tự có 1 identity key RIÊNG (đúng thuật toán
    -- Sesame của Signal, xem e2e_devices bên dưới) -- không còn khái niệm "xung đột identity" nữa vì
    -- không còn ai ghi đè ai, mỗi thiết bị 1 hàng riêng.
    ALTER TABLE users ADD COLUMN IF NOT EXISTS e2e_identity_key TEXT;

    -- Identity key (Curve25519, public) của TỪNG THIẾT BỊ (không phải từng user nữa) -- deviceId do
    -- CLIENT tự sinh 1 lần/trình duyệt (UUID ngẫu nhiên, lưu localStorage, KHÔNG BAO GIỜ đổi), private
    -- key KHÔNG BAO GIỜ rời máy (pickle + lưu IndexedDB, xem e2e-crypto.js). 1 user nhiều thiết bị =
    -- nhiều hàng ở đây, mỗi hàng độc lập -- gửi tin cho user nào phải mã hoá RIÊNG cho TỪNG thiết bị
    -- của họ (xem HallApiHandlers's GET /e2e/keys/bundle trả về MẢNG thiết bị, không phải 1 cái).
    CREATE TABLE IF NOT EXISTS e2e_devices (
        device_id UUID NOT NULL PRIMARY KEY,
        user_id UUID NOT NULL,
        identity_key TEXT NOT NULL,
        label TEXT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_e2e_devices_user ON e2e_devices (user_id);
    ALTER TABLE e2e_devices ADD COLUMN IF NOT EXISTS label TEXT;

    -- One-time prekey (Curve25519, public) -- mỗi cái CHỈ dùng 1 LẦN để thiết lập 1 Olm session mới
    -- (X3DH cần 1 prekey dùng 1 lần để có forward secrecy ngay từ tin đầu tiên, không chỉ dựa vào
    -- identity key cố định). Bên tạo session GET ra 1 key rồi server XÓA LUÔN (xem
    -- E2eKeyRegistry#claimOneTimePrekey) -- client tự sinh thêm lô mới khi thấy còn ít, giữ nguyên
    -- tinh thần "one-time" đúng nghĩa. Khoá theo device_id (không phải user_id nữa) -- cùng lý do e2e_devices.
    DROP TABLE IF EXISTS e2e_one_time_prekeys;
    CREATE TABLE e2e_one_time_prekeys (
        device_id UUID NOT NULL,
        key_id TEXT NOT NULL,
        public_key TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (device_id, key_id)
    );
    CREATE INDEX IF NOT EXISTS idx_e2e_one_time_prekeys_device ON e2e_one_time_prekeys (device_id, created_at);

    -- Bật/tắt mã hoá đầu cuối cho 1 conversation -- tích chọn (opt-in), mặc định false (giữ nguyên
    -- hành vi cũ, server đọc được search_text/preview như trước). Bật rồi thì KHÔNG tắt lại được nữa
    -- (xem HallApiHandlers#setConversationEncrypted) -- tránh vòng lặp lịch sử vừa mã hoá vừa không.
    ALTER TABLE conversations ADD COLUMN IF NOT EXISTS e2e_enabled BOOLEAN NOT NULL DEFAULT false;

    -- Ai là người BẤM NÚT bật mã hoá đầu cuối (chỉ ghi lần đầu, xem ConversationMembershipRegistry#
    -- setEncrypted dùng COALESCE để KHÔNG bị ghi đè bởi các lần gọi lại sau -- setEncrypted idempotent
    -- nên có thể bị gọi nhiều lần). Client dùng cột này để quyết định AI được phép chủ động tạo group
    -- MLS (xem e2eCheckGroupRotations phía frontend) -- PHẢI là chính người vừa bật (chắc chắn đang
    -- online lúc đó), KHÔNG phải suy ra tĩnh theo min(userId) như bản đầu tiên (bug thật đã gặp: nếu
    -- người có userId nhỏ nhất trong nhóm chưa từng mở app lần nào, không ai tạo được group MLS, cả
    -- nhóm kẹt vĩnh viễn ở "đang chờ thiết lập nhóm mã hoá"). NULL cho conversation bật E2E TRƯỚC KHI
    -- có cột này -- frontend tự fallback về cách tính cũ (min userId) khi gặp NULL, xem mls-crypto.js.
    ALTER TABLE conversations ADD COLUMN IF NOT EXISTS e2e_enabled_by UUID;

    -- Hàng đợi "to-device": tin BÁO HIỆU mã hoá (thiết lập Olm session, phân phối Megolm session key
    -- lúc bật mã hoá/rotate) gửi THẲNG cho 1 user cụ thể -- KHÁC hẳn message thường (không gắn với 1
    -- conversationId để fan-out theo Maglev, xem MessageDelivery) vì đích đến là 1 NGƯỜI, có thể đang
    -- offline. Còn sống (chưa bị lấy) thì vẫn nằm đây, drain hết + xoá sạch mỗi lần user đó connect lại
    -- (xem GET /e2e/to-device) -- nếu đang online thì CÒN được relay sống qua WS ngay lập tức (xem
    -- EventBus address e2e_to_device_sent, HallApiHandlers), bảng này là lưới an toàn khi offline.
    CREATE TABLE IF NOT EXISTS e2e_to_device_messages (
        id UUID NOT NULL PRIMARY KEY,
        recipient_user_id UUID NOT NULL,
        sender_user_id UUID NOT NULL,
        conversation_id UUID,
        type TEXT NOT NULL,
        body_json TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_e2e_to_device_recipient ON e2e_to_device_messages (recipient_user_id, created_at);
    CREATE INDEX IF NOT EXISTS idx_message_edits_message ON message_edits (message_id, edited_at);

    -- Mã liên kết thiết bị (KHÔNG quét QR -- gõ tay 6 ký tự) -- thiết bị MỚI (chưa có Olm.Account cục
    -- bộ) tự tạo 1 Account TẠM + xin 1 mã ngắn hạn (5 phút) ở đây; thiết bị ĐÃ bật E2E gõ mã đó vào,
    -- server trả (1 LẦN, atomic DELETE...RETURNING, xem E2eKeyRegistry#claimDeviceLinkRequest) đúng
    -- identity_key/one_time_key của thiết bị mới để thiết bị cũ mã hoá gói {accountPickle, pickleKey}
    -- CHUYỂN GIAO chính identity thật của mình -- server KHÔNG BAO GIỜ thấy accountPickle/pickleKey,
    -- chỉ trung chuyển public key ở BƯỚC NÀY (gói mã hoá thật đi qua hàng đợi to-device sẵn có, xem
    -- HallApiHandlers's device-link endpoints).
    CREATE TABLE IF NOT EXISTS e2e_device_link_requests (
        code TEXT NOT NULL PRIMARY KEY,
        user_id UUID NOT NULL,
        identity_key TEXT NOT NULL,
        one_time_key_id TEXT NOT NULL,
        one_time_key TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- ================= MLS (RFC 9420, engine ts-mls phía client -- vendor/mls.js) =================
    -- Server CHỈ làm Delivery Service tối giản (RFC 9750): directory KeyPackage + trung
    -- chuyển Welcome/Commit qua hàng đợi to-device SẴN CÓ (e2e_to_device_messages, type
    -- mls_*). PRIVATE KEY KHÔNG BAO GIỜ rời máy client, server không giải được gì cả.
    -- KeyPackage (public, wire MLS encodeMlsMessage -> base64) của TỪNG THIẾT BỊ MLS
    -- (device_id = UUID do client sinh 1 lần/trình duyệt). Claim = XOÁ LUÔN, dùng 1 lần
    -- (mỗi lần add member tiêu 1 KeyPackage -- cùng tinh thần one-time prekey bên Olm cũ);
    -- client tự top-up khi hết (xem GET /mls/key-package-count). Identity user BỌC TRONG
    -- credential basic của KeyPackage ("user:<userId>"), backend KHÔNG cần bảng credential riêng.
    CREATE TABLE IF NOT EXISTS mls_key_packages (
        id UUID NOT NULL PRIMARY KEY,
        device_id UUID NOT NULL,
        user_id UUID NOT NULL,
        key_package TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_mls_key_packages_user ON mls_key_packages (user_id, created_at);
    CREATE INDEX IF NOT EXISTS idx_mls_key_packages_device ON mls_key_packages (device_id, created_at);

    -- GroupInfo công khai MỚI NHẤT của 1 group MLS (RFC 9420 "External Commit") -- opaque với server
    -- (chuỗi base64 MLSMessage do client tự ký/mã hoá, server không đọc/parse được nội dung, giống
    -- KeyPackage). Cho phép 1 THÀNH VIÊN ĐÃ CÓ TRONG conversation_members nhưng CHƯA TỪNG join group
    -- MLS (chưa nhận được Welcome từ ai -- ví dụ họ chỉ mới đăng nhập lần đầu, chưa ai online để add
    -- hộ) TỰ MÌNH join ngay, không cần chờ member khác chủ động add -- bug thật đã gặp: nếu không ai
    -- khác đang online, người mới không có CÁCH NÀO join được nhóm mã hoá dù đã là thành viên hợp lệ,
    -- kẹt vĩnh viễn. Bất kỳ ai ĐÃ join group đều publish lại (ghi đè) sau mỗi lần epoch đổi (tạo
    -- nhóm/add/remove/nhận commit) -- xem frontend's e2ePublishGroupInfo. CHỈ member của đúng
    -- conversation đó (kiểm tra qua conversation_members) mới đọc/ghi được -- xem
    -- HallApiHandlers#getMlsGroupInfo/putMlsGroupInfo.
    -- epoch: dùng làm optimistic-concurrency token (compare-and-swap) chống SPLIT-BRAIN thật đã gặp
    -- -- 2 actor khác nhau (vd creator đang add member bình thường VÀ 1 member khác đang tự
    -- External-Join) cùng lúc tạo commit dựa trên CÙNG group state cũ, không ai biết ai, mỗi bên
    -- publish GroupInfo của epoch mới theo hướng RIÊNG -- ai ghi sau (last-write-wins, kiểu cũ)
    -- THẮNG một cách im lặng, còn bên thua vẫn deliver Welcome/Commit của MÌNH cho các member khác
    -- -> nhóm rẽ nhánh vĩnh viễn, giải mã lỗi "CryptoError: OperationError" không rõ nguyên nhân từ
    -- đó về sau. Client giờ PHẢI gửi kèm epoch cũ (expected) + epoch mới khi publish -- server chỉ
    -- ghi đè nếu epoch hiện tại ĐÚNG BẰNG epoch cũ client kỳ vọng (xem
    -- MlsRegistry#upsertGroupInfo/HallApiHandlers#putMlsGroupInfo); bên thua nhận về false, PHẢI bỏ
    -- state/commit vừa tạo (không lưu, không deliver) rồi thử lại từ GroupInfo mới nhất.
    CREATE TABLE IF NOT EXISTS mls_group_info (
        conversation_id UUID NOT NULL PRIMARY KEY,
        group_info TEXT NOT NULL,
        epoch BIGINT NOT NULL DEFAULT 0,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- Registry thiết bị MLS (device_id do client tự sinh 1 lần/trình duyệt, gửi kèm ngay lúc
    -- /register hoặc /login -- xem HallApiHandlers#issueToken) -- 2 việc: (1) cho user TỰ xem được
    -- danh sách thiết bị của chính mình (label đoán từ User-Agent, xem frontend's
    -- e2eGuessDeviceLabel) ở màn hình hồ sơ, (2) THU HỒI (revoke) 1 thiết bị -- "xoá thiết bị" trên
    -- UI đồng nghĩa buộc đăng xuất NGAY LẬP TỨC thiết bị đó, không đợi token JWT hết hạn tự nhiên:
    -- revoked_at khác NULL -> MỌI request (kể cả AUTH qua WebSocket ở harbor) mang JWT có deviceId
    -- này đều bị từ chối ngay từ MlsDeviceRegistry#isRevoked, dù chữ ký JWT vẫn hợp lệ và chưa hết
    -- hạn (JWT tự nó không mang trạng thái, không thể "thu hồi" theo nghĩa thông thường -- bảng này
    -- chính là danh sách thu hồi bù cho thiếu sót đó). 1 device_id đã revoke thì KHÔNG được tái sử
    -- dụng lại (registerDevice từ chối ghi đè khi đã revoked) -- client phải tự sinh device_id MỚI
    -- nếu muốn đăng nhập lại trên đúng trình duyệt đó.
    CREATE TABLE IF NOT EXISTS mls_devices (
        device_id UUID NOT NULL PRIMARY KEY,
        user_id UUID NOT NULL,
        label TEXT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        revoked_at TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS idx_mls_devices_user ON mls_devices (user_id, revoked_at);
