apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
spec:
  selector:
    app: {{ .Chart.Name }}
  # NodePort (khong phai ClusterIP nhu ban goc) -- demo.html chay tren may local can goi thang
  # duoc /v2/api/upload,/v2/api/download tu trinh duyet, cung cach cac module khac dang lam
  # (colony 31002, harbor 31003, herald 31007) -- xem HISTORY_API_BASE/HERALD_API_BASE trong demo.html.
  type: NodePort
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 31008
      name: public-http2
