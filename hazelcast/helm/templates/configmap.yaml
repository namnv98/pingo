apiVersion: v1
kind: ConfigMap
metadata:
  name: hazelcast-config
data:
  hazelcast.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <hazelcast xmlns="http://www.hazelcast.com/schema/config"
               xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:schemaLocation="http://www.hazelcast.com/schema/config
               https://www.hazelcast.com/schema/config/hazelcast-config-5.3.xsd">
        <!-- Cluster Hazelcast doc lap, kich thuoc co dinh (3 pod StatefulSet): khong phu thuoc
             k8s API discovery (da gay nhieu bug lien tiep: tu doan sai port, xung dot version
             plugin, race luc khoi dong dong thoi). StatefulSet cho DNS on dinh ngay tu dau nen
             tcp-ip tinh don gian va chac chan hon han. -->
        <network>
            <join>
                <multicast enabled="false"/>
                <kubernetes enabled="false"/>
                <tcp-ip enabled="true">
                    {{- range $i := until (int .Values.replicas) }}
                    <member>hazelcast-{{ $i }}.hazelcast-headless.{{ $.Release.Namespace }}.svc.cluster.local</member>
                    {{- end }}
                </tcp-ip>
            </join>
        </network>

        <multimap name="__vertx.subs">
            <backup-count>1</backup-count>
            <value-collection-type>SET</value-collection-type>
        </multimap>

        <map name="__vertx.haInfo">
            <backup-count>1</backup-count>
        </map>

        <map name="__vertx.nodeInfo">
            <backup-count>1</backup-count>
        </map>

        <cp-subsystem>
            <cp-member-count>0</cp-member-count>
            <semaphores>
                <semaphore>
                    <name>__vertx.*</name>
                    <jdk-compatible>false</jdk-compatible>
                    <initial-permits>1</initial-permits>
                </semaphore>
            </semaphores>
        </cp-subsystem>
    </hazelcast>
