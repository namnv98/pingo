apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config-files
data:
  app.yaml: |
    # Cluster Hazelcast CHUNG voi beacon/colony/harbor/hall -- can de nhan broadcast EventBus tu
    # colony (xem NotificationConsumer) va doc PresenceRegistry (MultiMap Hazelcast dung chung).
    hazelcast:
      file: /hazelcast-files/hazelcast.xml
      props: { }
    publicHttp:
      tags: public
      port: 8090
      path:
      headers:
        content-type: application/json
      printStackTrace: false
    # PHAI khop voi authTokenSecret cua hall/colony/harbor -- dung de verify JWT xac thuc client.
    authTokenSecret: pingo-local-dev-auth-secret
    database:
      parsedUri:
        databaseType: postgres
        scheme: steady
        addresses:
          - postgres:5432
        path: pingo
        user: pingo
        password: pingo-local-dev
        params:
          maxSize: 8
          maxWaitQueueSize: 256
    # Credentials Firebase Admin SDK (push qua FCM, xem PushService) -- day la project dev dung
    # chung (khong phai production), gia tri nay la private key THAT nen KHONG duoc log/paste ra
    # ngoai repo nay. Production that phai override bang service account rieng, xem javadoc
    # LegoConfig1.FirebaseConfig.
    firebase:
      serviceAccountJson: |
        {
          "type": "service_account",
          "project_id": "app-chat-5711a",
          "private_key_id": "",
          "private_key": ""
          "client_email": "",
          "client_id": "",
          "auth_uri": "",
          "token_uri": "",
          "auth_provider_x509_cert_url": "",
          "client_x509_cert_url": ""
          "universe_domain": ""
        }
  log4j2.xml: |
{{ .Files.Get "config/log4j2.xml" | indent 4 }}
