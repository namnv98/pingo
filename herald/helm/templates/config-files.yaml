apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config-files
data:
  app.yaml: |
    # Cluster Hazelcast CHUNG voi beacon/colony/harbor/hall -- can de nhan broadcast EventBus tu
    # colony (xem NotificationConsumer) va doc PresenceRegistry (MultiMap Hazelcast dung chung).
    hazelcast:
      file: /hazelcast-files/hazelcast.xml
      props: { }
    publicHttp:
      tags: public
      port: 8090
      path:
      headers:
        content-type: application/json
      printStackTrace: false
    # PHAI khop voi authTokenSecret cua hall/colony/harbor -- dung de verify JWT xac thuc client.
    authTokenSecret: pingo-local-dev-auth-secret
    database:
      parsedUri:
        databaseType: postgres
        scheme: steady
        addresses:
          - postgres:5432
        path: pingo
        user: pingo
        password: pingo-local-dev
        params:
          maxSize: 8
          maxWaitQueueSize: 256
    # Credentials Firebase Admin SDK (push qua FCM, xem PushService) -- CHUA co ha tang push that
    # (chua dang ky Firebase project nao ca) nen de RONG o day CO CHU DICH -- PushService tu chuyen
    # sang che do no-op khi gia tri nay rong/null (xem HeraldAppModule#pushService), notifications
    # van luu DB/doc qua GET /notifications binh thuong, chi rieng buoc gui push that bi bo qua.
    # BUG DA GAP THAT: ban truoc dien san 1 JSON placeholder SAI cu phap (thieu dau phay sau
    # "private_key"/"client_x509_cert_url") thay vi de rong -- khien GoogleCredentials.fromStream
    # nem MalformedJsonException lam CRASH ca herald ngay luc khoi dong (Guice provider loi -> toan
    # bo service khong len duoc), vi chuoi khong rong/null nen khong lot qua duoc check o tren. Muon
    # bat push that: dang ky Firebase project roi dan NGUYEN VAN noi dung file service-account JSON
    # thay cho chuoi rong nay (JSON phai hop le that, khong phai template placeholder).
    firebase:
      serviceAccountJson: ""
  log4j2.xml: |
{{ .Files.Get "config/log4j2.xml" | indent 4 }}
