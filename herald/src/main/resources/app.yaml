# Cluster Hazelcast CHUNG voi beacon/colony/harbor/hall -- can de nhan broadcast EventBus tu
# colony (xem NotificationConsumer) va doc PresenceRegistry (MultiMap Hazelcast dung chung).
hazelcast:
  file: herald/src/main/resources/hazelcast-local.xml
  props: { }
publicHttp:
  tags: public
  port: 8090
  path:
  headers:
    content-type: application/json
  printStackTrace: false
# PHAI khop voi authTokenSecret cua hall/colony/harbor -- dung de verify JWT xac thuc client.
authTokenSecret: pingo-local-dev-auth-secret

database:
  # Postgres cua chinh cum k3s local (xem postgres/helm), truy cap tu ngoai qua NodePort 31005 --
  # dung khi chay local bang "mvn exec:java" (khong o trong k8s nen khong resolve duoc DNS "postgres").
  parsedUri:
    databaseType: postgres
    scheme: steady
    addresses:
      - localhost:31005
    path: pingo
    user: pingo
    password: pingo-local-dev
    params:
      maxSize: 8
      maxWaitQueueSize: 256

# Credentials Firebase Admin SDK (push qua FCM, xem PushService) -- CHUA co ha tang push that, de
# RONG co chu dich: PushService tu chuyen sang che do no-op khi gia tri nay rong/null (xem
# HeraldAppModule#pushService), notifications van luu DB/doc qua GET /notifications binh thuong,
# chi rieng buoc gui push that bi bo qua. KHONG dien 1 JSON placeholder voi cac field rong nhu ban
# truoc ("private_key": ""...) -- chuoi KHONG rong/null se lot qua duoc check no-op nhung parse PEM
# key rong se nem loi khac (hoac MalformedJsonException neu con thieu dau phay), lam CRASH ca herald
# ngay luc khoi dong (bug da gap that, xem chu thich chi tiet o ban helm/templates/config-files.yaml).
# Muon bat push that: dang ky Firebase project roi dan NGUYEN VAN noi dung file service-account JSON
# thay cho chuoi rong nay (JSON phai hop le that, khong phai template placeholder) -- KHONG commit
# gia tri that vao file nay (nam trong git), chi dien tam o LOCAL sau khi pull.
firebase:
  serviceAccountJson: ""
