hazelcast:
  file: colony/src/main/resources/hazelcast-local.xml
  props: { }
admEventBus:
  address: eb_gossip_adm
  tags: private
  printStackTrace: false
msgEventBus:
  address: eb_gossip_adm
  tags: private
  printStackTrace: false
admHttp:
  tags: private
  port: 8086
  path:
  headers:
    content-type: application/json
chatSocket:
  host: 0.0.0.0
  port: 9999
  path: /connect
  serviceName: eb_gossip_adm # định danh fallback dùng cho local dev; khi chạy production, HOSTNAME (tên pod k8s) sẽ được ưu tiên dùng thay
invalidateCacheConfig:
  eventBusAddress: lego-invalid-cache-info
basePackage: com.lego.namnv
# PHAI khop voi authTokenSecret cua harbor va hall (khong con dung o colony de ky/verify JWT
# nua tu khi tach RestApiVerticle sang hall, giu lai o day chi vi LegoConfig1 dung chung).
authTokenSecret: pingo-local-dev-auth-secret

database:
  # Postgres cua chinh cum k3s local (xem postgres/helm), truy cap tu ngoai qua NodePort 31005 --
  # dung khi chay local bang "mvn exec:java" (khong o trong k8s nen khong resolve duoc DNS "postgres").
  parsedUri:
    databaseType: postgres
    scheme: steady
    addresses:
      - localhost:31005
    path: pingo
    user: pingo
    password: pingo-local-dev
    params:
      # 8 la bottleneck that: load-test 50 session/~2500 tin/s lam Postgres connection pool nghen
      # ("Connection pool reached max wait queue size"), Postgres cluster nay cho phep max_connections=100
      # va chi colony + hall dung pool nay (toi da 3 replica colony trong resilience-test) nen 24/replica
      # van con nhieu du dia (3*24=72, con du cho hall + cac ket noi admin khac).
      maxSize: 24
      maxWaitQueueSize: 1024
