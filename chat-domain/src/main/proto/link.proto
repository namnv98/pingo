syntax = "proto3";

package com.pingo.chat.grpc;

option java_package = "com.pingo.chat.grpc";
option java_multiple_files = true;

// Envelope + service duy nhat cho chang harbor<->colony (KHONG dung cho client<->harbor -- cai do
// van la SockJS/WebSocket + JSON SocketFrame, khong doi, xem ARCHITECTURE.md muc 3). Thay the toan
// bo BackendLinkGateway's N-shard-link + colony's ChatLink/ChatSubscriber split cu: gRPC/HTTP2 da
// tu multiplex nhieu stream tren 1 connection dung, nen 1 call = 1 (harbor session, colony pod) --
// khong con can field harborSessionId de demux nua, vi ban than stream la 1 danh tinh (identity)
// roi (xem ARCHITECTURE.md muc 12, viet lai).
enum FrameType {
  FRAME_TYPE_UNSPECIFIED = 0;
  SUBSCRIBE = 1;
  SUBSCRIBE_OK = 2;
  SUBSCRIBE_ERROR = 3;
  MESSAGE = 4;
  ACK = 5;
  ERROR = 6;
  // Dang ky hang loat conversationId DA TON TAI (khac SUBSCRIBE: khong mang member_user_ids, khong
  // lazy-create membership/ghi DB) -- harbor tu gui 1 lan ngay sau AUTH, gom het conversationId cua
  // user theo TUNG POD dich (1 frame/pod, khong phai 1 frame/conversationId), tham khao dung cach
  // Slack lam ("GS subscribes to all channel servers... asynchronously", xem ARCHITECTURE.md muc 12).
  SUBSCRIBE_BULK = 7;
  SUBSCRIBE_BULK_OK = 8;
  // Colony chu dong PING khi 1 session sap idle (chi nhan tin, khong tu gui gi len se khong bao gio
  // tu sinh hoat dong) -- harbor PONG lai ngay, cap nhat lastSeenAt ben colony, tranh dong oan
  // stream dang duoc dung de day tin cho 1 nguoi nhan thu dong (cung 1 loai bug da gap va sua o
  // client<->harbor, xem HarborSessionManager#heartbeatSweep).
  PING = 9;
  PONG = 10;
}

message Frame {
  string id = 1;
  FrameType type = 2;
  string from_user_id = 3;
  string conversation_id = 4;
  repeated string member_user_ids = 5;
  // Payload tuy y (opaque), JSON-encoded string -- server khong doc/hieu noi dung ben trong, cung
  // hop dong voi SocketFrame.body ben client<->harbor, chi khac cho tuong minh ve encoding vi
  // proto3 khong co kieu "JSON tu do" nhu JsonObject cua Vert.x.
  string body_json = 6;
  string reason = 7;
  int64 ts = 8;
  // Chi dung cho SUBSCRIBE_BULK: danh sach conversationId (da xac nhan la member) can dang ky vao
  // 1 lan, cung 1 pod dich.
  repeated string conversation_ids = 9;
}

service Link {
  // 1 call = ca vong doi cua 1 (harbor session, colony pod) -- moi SUBSCRIBE/MESSAGE cua session do
  // toi dung pod do di tren cung 1 stream nay, theo thu tu. Stream ket thuc (client end() hoac
  // server end()) thay the hoan toan cho SESSION_CLOSED frame cu.
  rpc Stream(stream Frame) returns (stream Frame);
}
